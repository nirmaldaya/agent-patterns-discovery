        keywords: [healthcare, health care, patient*, clinical, clinician*, hospital*, hl7, fhir, ehr, emr,
                   hipaa, diagnosis, diagnoses, epic ehr, icd 10, icd10, cpt code*, prior auth*, prior authorization, medicaid, medicare,
                   payer*, provider network, care management, nurse*, physician*, medical]
      - label: Life Sciences & Pharma
        keywords: [pharma*, clinical trial*, pharmacovigilance, drug*, fda, gxp, life science*, biotech*,
                   adverse event*, regulatory submission*]
      - label: Insurance
        keywords: [insurance, insurer*, policyholder*, underwrit*, fnol, first notice of loss, claims adjust*,
                   insurance premium*, premium calculation, actuar*, reinsurance, guidewire, duck creek, loss ratio, policy admin*]
      - label: Banking & Financial Services
        keywords: [bank*, kyc, aml, anti money laundering, loan*, mortgage*, credit card*, payments, swift message*, swift mt,
                   basel, trading, wealth management, fintech, lending, credit risk, fraud detection, capital markets,
                   brokerage, fixed income, treasury]
      - label: Retail & CPG
        keywords: [retail*, sku*, e commerce, ecommerce, merchandis*, planogram*, point of sale, store operations,
                   cpg, consumer goods, shopper*, loyalty program*, omnichannel]
      - label: Manufacturing
        keywords: [manufactur*, shop floor, plant maintenance, bill of materials, bom, mes, production line,
                   predictive maintenance, quality inspection, industrial]
      - label: Telecom & Media
        keywords: [telecom*, telco, 5g, oss bss, network operator*, broadband, media,
                   broadcasting, streaming service*]
      - label: Energy & Utilities
        keywords: [utility company, utility companies, utilities sector, energy, power grid, smart meter*, oil and gas,
                   oil & gas, renewable*, outage management]
      - label: Travel & Hospitality
        keywords: [airline*, travel, hotel*, hospitality, booking*, reservation*, itinerar*, passenger*]
      - label: Public Sector
        keywords: [government, public sector, citizen service*, municipal*, federal, tax authority, public service*]
      - label: Logistics & Supply Chain
        keywords: [logistics, shipment*, freight, warehouse management, fleet, last mile, supply chain]

  BUSINESS_FUNCTION:
    description: Business function (domain) the artifact serves
    labels:
      - {label: Software Engineering & IT, keywords: [software, developer*, engineering, it operations, devops, application support, code]}
      - {label: Customer Service, keywords: [customer service, customer support, contact center, call center, chatbot, faq, customer query, customer queries, complaint*]}
      - {label: Human Resources, keywords: [hr, human resource*, recruit*, hiring, candidate*, resume screening, resume parsing, curriculum vitae, cv, employee onboarding, payroll, employee*, talent]}
      - {label: Finance & Accounting, keywords: [finance, financial, accounting, invoice*, accounts payable, accounts receivable, reconciliation, ledger, audit*, tax, budget*, expense*]}
      - {label: Sales & Marketing, keywords: [sales, marketing, lead, leads, lead generation, crm, campaign*, prospect*, proposal*, rfp, pitch, seo, content marketing]}
      - {label: Legal & Compliance, keywords: [legal, contract*, compliance, regulatory, regulation*, gdpr, policy review, clause*, litigation, sox]}
      - {label: Procurement, keywords: [procurement, purchase order*, vendor*, supplier*, sourcing, rfq]}
      - {label: Data & Analytics, keywords: [analytics, dashboard*, reporting, report generation, insight*, kpi*, data quality, data pipeline*, etl, data engineering, data analysis]}
      - {label: Security, keywords: [security, cyber*, threat*, vulnerabilit*, penetration test*, soc, siem, iam]}

  AGENT_ARCHETYPE:
    description: What kind of cognitive task the artifact performs
    labels:
      - {label: Summarizer, keywords: [summari*, summary, digest, condense, tl dr, tldr]}
      - {label: Extractor, keywords: [extract*, parse*, parsing, scrape*, capture data, data extraction, entity extraction]}
      - {label: Classifier / Router, keywords: [classif*, categori*, triage, route*, routing, tagging, intent detection, sentiment]}
      - {label: Generator, keywords: [generat*, draft*, write*, compose*, authoring, create content, content creation]}
