      - {label: Converter / Translator, keywords: [convert*, conversion, translat*, transform*, migrat*, transpil*]}
      - {label: Q&A / Knowledge Assistant, keywords: [question answering, q&a, qna, answer question*, knowledge assistant, chat with, ask questions, assistant]}
      - {label: Planner / Orchestrator, keywords: [plan, plans, planner*, planning, orchestrat*, coordinat*, manager agent, supervisor, decompos*, delegat*]}
      - {label: Analyzer, keywords: [analy*, investigat*, diagnos*, root cause, insight*, forecast*, predict*]}
